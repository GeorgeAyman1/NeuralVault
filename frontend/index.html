<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NeuralVault</title>
<style>
  :root {
    --bg: #14181d;
    --panel: #1c222a;
    --panel-2: #232b35;
    --border: #2e3743;
    --ink: #e6edf3;
    --muted: #8b97a6;
    --accent: #e8a13a;        /* amber */
    --accent-dim: #b87d28;
    --good: #4caf72;
    --bad: #e0564f;
    --user: #2a3441;
    --mono: ui-monospace, "SF Mono", "Cascadia Code", Consolas, monospace;
    --sans: "Segoe UI", system-ui, -apple-system, sans-serif;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font-family: var(--sans); line-height: 1.5;
  }
  header {
    padding: 14px 24px; border-bottom: 1px solid var(--border);
    display: flex; align-items: center; gap: 14px; background: var(--panel);
  }
  header h1 { font-size: 18px; margin: 0; letter-spacing: 0.5px; }
  header .logo {
    width: 26px; height: 26px; border-radius: 6px;
    background: linear-gradient(135deg, var(--accent), var(--accent-dim));
    display: grid; place-items: center; font-weight: 700; color: #14181d;
  }
  header .status { margin-left: auto; font-size: 13px; color: var(--muted); }
  header .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 6px; }
  nav {
    display: flex; gap: 4px; padding: 0 24px; background: var(--panel);
    border-bottom: 1px solid var(--border);
  }
  nav button {
    background: none; border: none; color: var(--muted); padding: 12px 16px;
    cursor: pointer; font-size: 14px; border-bottom: 2px solid transparent;
  }
  nav button.active { color: var(--ink); border-bottom-color: var(--accent); }
  main { max-width: 920px; margin: 0 auto; padding: 24px; }
  .tab { display: none; }
  .tab.active { display: block; }
  .row { display: flex; gap: 10px; align-items: center; }
  input[type=text], textarea {
    background: var(--panel-2); border: 1px solid var(--border); color: var(--ink);
    border-radius: 8px; padding: 10px 12px; font-family: var(--sans); font-size: 14px; width: 100%;
  }
  textarea { resize: vertical; min-height: 44px; }
  input[type=number] { width: 70px; background: var(--panel-2); border: 1px solid var(--border);
    color: var(--ink); border-radius: 8px; padding: 9px; font-size: 14px; }
  button.btn {
    background: var(--accent); color: #14181d; border: none; border-radius: 8px;
    padding: 10px 18px; font-weight: 600; cursor: pointer; font-size: 14px; white-space: nowrap;
  }
  button.btn.ghost { background: transparent; color: var(--muted); border: 1px solid var(--border); }
  button.btn:disabled { opacity: 0.5; cursor: not-allowed; }
  label { font-size: 13px; color: var(--muted); }
  .card { background: var(--panel); border: 1px solid var(--border); border-radius: 10px; padding: 16px; margin-bottom: 14px; }
  /* Chat */
  #log { display: flex; flex-direction: column; gap: 14px; margin-bottom: 16px; }
  .msg { max-width: 86%; padding: 12px 14px; border-radius: 12px; white-space: pre-wrap; }
  .msg.user { align-self: flex-end; background: var(--user); }
  .msg.assistant { align-self: flex-start; background: var(--panel); border: 1px solid var(--border); }
  .sources { margin-top: 10px; border-top: 1px dashed var(--border); padding-top: 8px; }
  .sources h4 { margin: 0 0 6px; font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.5px; }
  .source { font-size: 13px; padding: 6px 0; border-bottom: 1px solid var(--border); }
  .source:last-child { border-bottom: none; }
  .score { font-family: var(--mono); color: var(--accent); font-size: 12px; }
  .bar { display: inline-block; height: 6px; background: var(--accent); border-radius: 3px; vertical-align: middle; margin-left: 6px; }
  /* Explorer */
  .mem { border: 1px solid var(--border); border-radius: 8px; padding: 12px; margin-bottom: 10px; background: var(--panel); }
  .mem .meta { font-family: var(--mono); font-size: 11px; color: var(--muted); margin-top: 6px; }
  .mem .head { display: flex; justify-content: space-between; gap: 8px; }
  .idx { font-family: var(--mono); color: var(--accent); font-size: 12px; }
  .del { background: none; border: 1px solid var(--border); color: var(--bad); border-radius: 6px; cursor: pointer; padding: 4px 10px; font-size: 12px; }
  /* Dashboard */
  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px,1fr)); gap: 12px; margin-bottom: 16px; }
  .stat { background: var(--panel); border: 1px solid var(--border); border-radius: 10px; padding: 16px; }
  .stat .v { font-size: 26px; font-weight: 700; font-family: var(--mono); }
  .stat .k { font-size: 12px; color: var(--muted); margin-top: 4px; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--border); }
  th { color: var(--muted); font-weight: 600; }
  td.num { font-family: var(--mono); text-align: right; }
  .toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
    background: var(--panel-2); border: 1px solid var(--border); padding: 10px 18px;
    border-radius: 8px; opacity: 0; transition: opacity 0.2s; pointer-events: none; }
  .toast.show { opacity: 1; }
  .empty { color: var(--muted); font-style: italic; padding: 20px 0; }
</style>
</head>
<body>
<header>
  <div class="logo">N</div>
  <h1>NeuralVault</h1>
  <div class="status" id="hdr-status"><span class="dot" style="background:var(--muted)"></span>connecting…</div>
</header>
<nav>
  <button data-tab="chat" class="active">Chat</button>
  <button data-tab="explorer">Memory Explorer</button>
  <button data-tab="dashboard">Dashboard</button>
</nav>

<main>
  <!-- CHAT -->
  <section id="chat" class="tab active">
    <div id="log"></div>
    <div class="card">
      <div class="row">
        <textarea id="chat-input" placeholder="Ask something grounded in your memories…"></textarea>
      </div>
      <div class="row" style="margin-top:10px">
        <label>top_k</label>
        <input type="number" id="chat-topk" value="5" min="1" max="50">
        <button class="btn" id="chat-send">Send</button>
        <button class="btn ghost" id="chat-reset">Reset conversation</button>
      </div>
    </div>
  </section>

  <!-- EXPLORER -->
  <section id="explorer" class="tab">
    <div class="card">
      <label>Add a memory</label>
      <div class="row" style="margin-top:8px">
        <textarea id="add-text" placeholder="Text to remember…"></textarea>
        <button class="btn" id="add-btn">Add</button>
      </div>
    </div>
    <div class="card">
      <label>Semantic search</label>
      <div class="row" style="margin-top:8px">
        <input type="text" id="search-q" placeholder="Search memories by meaning…">
        <input type="number" id="search-topk" value="5" min="1" max="50">
        <button class="btn" id="search-btn">Search</button>
        <button class="btn ghost" id="browse-btn">Browse all</button>
      </div>
    </div>
    <div id="mem-list"></div>
  </section>

  <!-- DASHBOARD -->
  <section id="dashboard" class="tab">
    <div class="row" style="justify-content:flex-end; margin-bottom:12px">
      <button class="btn ghost" id="dash-refresh">Refresh</button>
    </div>
    <div class="grid" id="dash-stats"></div>
    <div class="card">
      <h4 style="margin:0 0 10px; color:var(--muted)">Per-operation metrics</h4>
      <table id="ops-table"><thead><tr><th>Operation</th><th class="num">Count</th><th class="num">Errors</th><th class="num">Avg ms</th></tr></thead><tbody></tbody></table>
    </div>
  </section>
</main>

<div class="toast" id="toast"></div>

<script>
const $ = (s) => document.querySelector(s);
const api = (path, opts) => fetch(path, opts).then(async r => {
  const body = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(body.detail || r.statusText);
  return body;
});
function toast(msg) {
  const t = $("#toast"); t.textContent = msg; t.classList.add("show");
  setTimeout(() => t.classList.remove("show"), 2200);
}
function esc(s) { const d = document.createElement("div"); d.textContent = s ?? ""; return d.innerHTML; }

// --- Tabs ---
document.querySelectorAll("nav button").forEach(b => {
  b.onclick = () => {
    document.querySelectorAll("nav button").forEach(x => x.classList.remove("active"));
    document.querySelectorAll(".tab").forEach(x => x.classList.remove("active"));
    b.classList.add("active");
    $("#" + b.dataset.tab).classList.add("active");
    if (b.dataset.tab === "dashboard") loadDashboard();
    if (b.dataset.tab === "explorer") browse();
  };
});

// --- Header status ---
async function refreshStatus() {
  try {
    const r = await api("/health/ready");
    const color = r.llm_available ? "var(--good)" : "var(--accent)";
    const txt = r.llm_available ? `LLM ready · ${r.model}` : "running (no LLM key)";
    $("#hdr-status").innerHTML = `<span class="dot" style="background:${color}"></span>${txt}`;
  } catch {
    $("#hdr-status").innerHTML = `<span class="dot" style="background:var(--bad)"></span>offline`;
  }
}

// --- Chat ---
function addMsg(role, text) {
  const div = document.createElement("div");
  div.className = "msg " + role;
  div.textContent = text;
  $("#log").appendChild(div);
  div.scrollIntoView({ behavior: "smooth", block: "end" });
  return div;
}
function addSources(div, memories) {
  if (!memories || !memories.length) return;
  const s = document.createElement("div"); s.className = "sources";
  s.innerHTML = "<h4>Memories used</h4>" + memories.map(m => {
    const score = m.score == null ? "" : Number(m.score).toFixed(3);
    const w = m.score == null ? 0 : Math.max(2, Math.round(Math.min(1, m.score) * 60));
    return `<div class="source"><span class="score">[${m.index}] ${score}</span>
      <span class="bar" style="width:${w}px"></span><br>${esc((m.text||"").slice(0,160))}</div>`;
  }).join("");
  div.appendChild(s);
}
async function sendChat() {
  const input = $("#chat-input"); const q = input.value.trim();
  if (!q) return;
  addMsg("user", q); input.value = "";
  $("#chat-send").disabled = true;
  const thinking = addMsg("assistant", "…");
  try {
    const r = await api("/memory/chat", {
      method: "POST", headers: {"Content-Type": "application/json"},
      body: JSON.stringify({ query: q, top_k: +$("#chat-topk").value })
    });
    thinking.textContent = r.answer;
    addSources(thinking, r.memories_used);
  } catch (e) {
    thinking.textContent = "⚠ " + e.message;
    thinking.style.borderColor = "var(--bad)";
  } finally {
    $("#chat-send").disabled = false;
  }
}
$("#chat-send").onclick = sendChat;
$("#chat-input").addEventListener("keydown", e => {
  if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); sendChat(); }
});
$("#chat-reset").onclick = async () => {
  await api("/memory/chat/reset", { method: "POST" });
  $("#log").innerHTML = ""; toast("Conversation reset");
};

// --- Explorer ---
function renderMems(items, withScore) {
  const list = $("#mem-list");
  if (!items.length) { list.innerHTML = '<div class="empty">No memories.</div>'; return; }
  list.innerHTML = items.map(m => {
    const idx = m.index;
    const score = withScore && m.score != null ? `<span class="score">${Number(m.score).toFixed(3)}</span>` : "";
    const meta = m.metadata && Object.keys(m.metadata).length ? JSON.stringify(m.metadata) : "{}";
    const created = m.created_at ? m.created_at.slice(0,19).replace("T"," ") : "";
    return `<div class="mem">
      <div class="head"><span class="idx">#${idx} ${score}</span>
        <button class="del" data-idx="${idx}">delete</button></div>
      <div>${esc(m.text)}</div>
      <div class="meta">id=${esc((m.id||"").slice(0,8))} · ${esc(created)} · meta=${esc(meta)}</div>
    </div>`;
  }).join("");
  list.querySelectorAll(".del").forEach(b => b.onclick = () => delMem(+b.dataset.idx));
}
async function browse() {
  try { const r = await api("/memory/list?limit=100"); renderMems(r.items, false); }
  catch (e) { toast(e.message); }
}
async function search() {
  const q = $("#search-q").value.trim(); if (!q) return browse();
  try {
    const r = await api("/memory/search", {
      method: "POST", headers: {"Content-Type":"application/json"},
      body: JSON.stringify({ query: q, top_k: +$("#search-topk").value })
    });
    // search results have no index; map via list is overkill — show with id only
    renderMems(r.map((m,i) => ({ index: "—", ...m })), true);
  } catch (e) { toast(e.message); }
}
async function delMem(idx) {
  if (idx === "—") { toast("Use Browse to delete by index"); return; }
  try { await api("/memory/" + idx, { method: "DELETE" }); toast("Deleted #" + idx); browse(); }
  catch (e) { toast(e.message); }
}
$("#add-btn").onclick = async () => {
  const t = $("#add-text").value.trim(); if (!t) return;
  try {
    await api("/memory/add", { method:"POST", headers:{"Content-Type":"application/json"},
      body: JSON.stringify({ text: t }) });
    $("#add-text").value = ""; toast("Memory added"); browse();
  } catch (e) { toast(e.message); }
};
$("#search-btn").onclick = search;
$("#browse-btn").onclick = browse;
$("#search-q").addEventListener("keydown", e => { if (e.key==="Enter") search(); });

// --- Dashboard ---
async function loadDashboard() {
  try {
    const [ready, metrics, count] = await Promise.all([
      api("/health/ready"), api("/metrics"), api("/memory/count")
    ]);
    const stats = [
      ["Total memories", count.count],
      ["Total requests", metrics.total_requests],
      ["Total errors", metrics.total_errors],
      ["Uptime (s)", metrics.uptime_seconds],
      ["LLM available", ready.llm_available ? "yes" : "no"],
      ["Model", ready.model],
    ];
    $("#dash-stats").innerHTML = stats.map(([k,v]) =>
      `<div class="stat"><div class="v">${esc(String(v))}</div><div class="k">${k}</div></div>`).join("");
    const ops = metrics.operations || {};
    const rows = Object.entries(ops).map(([op,d]) =>
      `<tr><td>${esc(op)}</td><td class="num">${d.count}</td><td class="num">${d.errors}</td><td class="num">${d.avg_latency_ms}</td></tr>`).join("");
    $("#ops-table tbody").innerHTML = rows || '<tr><td colspan="4" class="empty">No traffic yet.</td></tr>';
  } catch (e) { toast(e.message); }
}
$("#dash-refresh").onclick = loadDashboard;

// --- init ---
refreshStatus();
setInterval(refreshStatus, 15000);
</script>
</body>
</html>
